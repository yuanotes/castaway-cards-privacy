<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy policy for Castaway Cards by Brooklyn">
  <title>{{ page.title | default: site.title | escape }}</title>
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 52rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; font-family: system-ui, sans-serif; line-height: 1.75; overflow-wrap: anywhere; }
    h1, h2, h3 { line-height: 1.35; }
    h2 { margin-top: 2.5rem; }
    a { color: #0866c6; }
    blockquote { margin: 1.5rem 0; padding: .25rem 1rem; border-inline-start: .25rem solid #888; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { border: 1px solid #888; padding: .5rem; text-align: start; }
    hr { margin: 3rem 0; }
    @media (prefers-color-scheme: dark) { a { color: #82bbff; } }
  </style>
</head>
<body>
  <main>{{ content }}</main>
</body>
</html>
